<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vishal Prajapati | Java Backend Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/hero.css}" />
  </head>

  <body>

    <section class="hero" id="home">
      <div class="container hero-inner">
        <div class="hero-text">
          <p class="hero-greeting">Hi, I'm</p>

          
          <h1 class="hero-name" th:text="${name}">Your Name</h1>
          <h2 class="hero-title" th:text="${title}">Your Role</h2>
          <p class="hero-tagline" th:text="${tagline}">Your one line intro.</p>

          <div class="hero-buttons">
            <a href="#projects" class="btn btn-primary">See my projects</a>
            <a href="#contact" class="btn btn-outline">Contact me</a>
          </div>
        </div>

        <div class="hero-photo">
          
          <img th:src="@{/images/profile.jpg}" th:alt="${name}" alt="Profile photo" />
        </div>
      </div>
    </section>
  </body>
</html>
